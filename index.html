<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カード省略表示一覧</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f5f5f8;color:#222;font-family:'Noto Sans JP',sans-serif;font-size:13px;padding:12px;}
  h1{text-align:center;font-size:16px;color:#333;margin-bottom:10px;letter-spacing:2px;}

  /* フィルターバー */
  .filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
  .filter-btn{padding:4px 10px;border:1px solid #bbb;border-radius:12px;background:#fff;color:#333;cursor:pointer;font-size:11px;transition:all .15s;}
  .filter-btn:hover{background:#e8e8ee;border-color:#888;}
  .filter-btn.active{font-weight:700;color:#fff;}
  .filter-btn[data-type="all"].active{background:#555;border-color:#555;}
  .filter-btn[data-type="attack"].active{background:#c0392b;border-color:#c0392b;}
  .filter-btn[data-type="shield"].active{background:#1a6898;border-color:#1a6898;}
  .filter-btn[data-type="heal"].active{background:#1a8048;border-color:#1a8048;}
  .filter-btn[data-type="skill"].active{background:#6020a8;border-color:#6020a8;}
  .filter-btn[data-type="curse"].active{background:#7030a0;border-color:#7030a0;}
  .filter-btn[data-type="bougai"].active{background:#883030;border-color:#883030;}

  /* 検索 */
  .search-wrap{text-align:center;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;}
  .search-wrap input{background:#fff;border:1px solid #bbb;color:#222;padding:5px 12px;border-radius:16px;font-size:12px;width:200px;outline:none;}
  .search-wrap input::placeholder{color:#aaa;}
  .search-wrap input:focus{border-color:#555;}
  .search-wrap select{background:#fff;border:1px solid #bbb;color:#333;padding:5px 10px;border-radius:16px;font-size:11px;outline:none;cursor:pointer;}
  .search-wrap select:focus{border-color:#555;}
  #view-toggle{padding:5px 12px;border:1px solid #bbb;border-radius:16px;background:#fff;color:#333;cursor:pointer;font-size:11px;transition:all .15s;}
  #view-toggle:hover{background:#e8e8ee;border-color:#888;}
  #view-toggle.active{background:#444;border-color:#444;color:#fff;}

  /* 件数内訳 */
  .count-breakdown{text-align:center;color:#999;font-size:10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;}

  /* カード表示（モバイル向け） */
  .card-wrap{display:none;grid-template-columns:1fr;gap:8px;}
  .card-wrap.show{display:grid;}
  .table-wrap.hide{display:none;}
  .card-item{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 12px;}
  .card-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;}
  .card-item-name{font-weight:700;color:#111;font-size:13px;}
  .card-item-cost{font-weight:700;color:#444;font-size:13px;flex-shrink:0;}
  .card-item-tags{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .card-item-short{color:#111;font-size:12px;font-weight:700;margin-bottom:3px;}
  .card-item-desc{color:#555;font-size:11px;line-height:1.5;}

  @media (max-width:600px){
    .table-wrap{overflow-x:auto;}
  }

  /* テーブル */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:#e0e0e8;color:#444;font-size:10px;font-weight:700;letter-spacing:1px;padding:6px 8px;text-align:left;border-bottom:2px solid #bbb;position:sticky;top:0;z-index:1;}
  tbody tr{border-bottom:1px solid #ddd;transition:background .1s;background:#fff;}
  tbody tr:nth-child(even){background:#f8f8fc;}
  tbody tr:hover{background:#eeeef8;}
  tbody tr.hidden{display:none;}
  td{padding:6px 8px;vertical-align:middle;}

  .col-name{color:#111;font-weight:700;white-space:nowrap;}

  /* タイプ色 */
  .type-tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;}
  .type-attack{color:#fff;background:#c0392b;}
  .type-shield{color:#fff;background:#1a6898;}
  .type-heal{color:#fff;background:#1a8048;}
  .type-skill{color:#fff;background:#6020a8;}
  .type-curse{color:#fff;background:#7030a0;}
  .type-bougai{color:#fff;background:#883030;}

  /* レアリティ色 — 白背景向けに濃いめ */
  .r-common{color:#666;}
  .r-uncommon{color:#1a6898;}
  .r-rare{color:#b06000;}
  .r-epic{color:#6020a8;}
  .r-legendary{color:#a07000;}
  .r-gauge{color:#1a8048;}
  .r-hindrance{color:#c0392b;}

  .shortdesc{color:#111;font-size:12px;font-weight:700;}
  .fulldesc{color:#555;font-size:11px;line-height:1.5;}

  .rarity-btn{padding:4px 10px;border:1px solid #bbb;border-radius:12px;background:#fff;color:#333;cursor:pointer;font-size:11px;transition:all .15s;}
  .rarity-btn:hover{background:#e8e8ee;border-color:#888;}
  .rarity-btn.active{font-weight:700;color:#fff;}
  .rarity-btn[data-rarity="all"].active{background:#555;border-color:#555;}
  .rarity-btn[data-rarity="common"].active{background:#666;border-color:#666;}
  .rarity-btn[data-rarity="uncommon"].active{background:#1a6898;border-color:#1a6898;}
  .rarity-btn[data-rarity="rare"].active{background:#b06000;border-color:#b06000;}
  .rarity-btn[data-rarity="epic"].active{background:#6020a8;border-color:#6020a8;}
  .rarity-btn[data-rarity="legendary"].active{background:#a07000;border-color:#a07000;}
  .rarity-btn[data-rarity="gauge"].active{background:#1a8048;border-color:#1a8048;}
  .rarity-btn[data-rarity="hindrance"].active{background:#c0392b;border-color:#c0392b;}
  .cost-btn{padding:4px 12px;border:1px solid #bbb;border-radius:12px;background:#fff;color:#333;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;}
  .cost-btn:hover{background:#e8e8ee;border-color:#888;}
  .cost-btn.active{background:#444;border-color:#444;color:#fff;}
  .count{text-align:center;color:#888;font-size:11px;margin-bottom:6px;}
</style>
</head>
<body>
<h1>📋 カード省略表示一覧</h1>

<div style="text-align:center;font-size:10px;color:#888;margin-bottom:4px;">▼ タイプ</div>
<div class="filters" id="type-filters">
  <button class="filter-btn active" data-type="all">すべて</button>
  <button class="filter-btn" data-type="attack">⚔️ 攻撃</button>
  <button class="filter-btn" data-type="shield">🛡️ 防御</button>
  <button class="filter-btn" data-type="heal">💚 回復</button>
  <button class="filter-btn" data-type="skill">🔮 スキル</button>
  <button class="filter-btn" data-type="curse">☠️ 呪い</button>
  <button class="filter-btn" data-type="bougai">🚫 妨害</button>
</div>
<div style="text-align:center;font-size:10px;color:#888;margin-bottom:4px;margin-top:8px;">▼ レアリティ</div>
<div class="filters" id="rarity-filters">
  <button class="rarity-btn active" data-rarity="all">すべて</button>
  <button class="rarity-btn" data-rarity="common">コモン</button>
  <button class="rarity-btn" data-rarity="uncommon">アンコモン</button>
  <button class="rarity-btn" data-rarity="rare">レア</button>
  <button class="rarity-btn" data-rarity="epic">エピック</button>
  <button class="rarity-btn" data-rarity="legendary">伝説</button>
  <button class="rarity-btn" data-rarity="gauge">ゲージ</button>
  <button class="rarity-btn" data-rarity="hindrance">妨害カード</button>
</div>
<div style="text-align:center;font-size:10px;color:#888;margin-bottom:4px;margin-top:8px;">▼ コスト</div>
<div class="filters" id="cost-filters">
  <button class="cost-btn active" data-cost="all">すべて</button>
  <button class="cost-btn" data-cost="0">0</button>
  <button class="cost-btn" data-cost="1">1</button>
  <button class="cost-btn" data-cost="2">2</button>
  <button class="cost-btn" data-cost="3">3</button>
  <button class="cost-btn" data-cost="4">4</button>
  <button class="cost-btn" data-cost="5">5</button>
</div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="カード名・省略文で検索…">
    <select id="sort-select">
      <option value="default">並び順: 標準</option>
      <option value="cost-asc">コスト: 低い順</option>
      <option value="cost-desc">コスト: 高い順</option>
      <option value="rarity">レアリティ順</option>
      <option value="name">名前順</option>
    </select>
    <button id="view-toggle" type="button">📱 カード表示</button>
  </div>

<div class="count" id="count"></div>
<div class="count-breakdown" id="count-breakdown"></div>

<div class="card-wrap" id="card-wrap"></div>

<div class="table-wrap" id="table-wrap">
<table id="card-table">
<thead>
  <tr>
    <th>カード名</th>
    <th>コスト</th>
    <th>タイプ</th>
    <th>レアリティ</th>
    <th>省略表示</th>
    <th>完全な説明</th>
  </tr>
</thead>
<tbody id="tbody">
</tbody>
</table>
</div>

const rarityOrder={common:0,uncommon:1,rare:2,epic:3,legendary:4,gauge:5,hindrance:6};
const rarityLabel={common:'コモン',uncommon:'アンコモン',rare:'レア',epic:'エピック',legendary:'伝説',gauge:'ゲージ',hindrance:'妨害'};
const typeLabel={attack:'攻撃',shield:'防御',heal:'回復',skill:'スキル',curse:'呪い',bougai:'妨害'};

let currentType = 'all';
let currentRarity = 'all';
let currentCost = 'all';
let currentSort = 'default';
let cardViewOn = false;

function sortCards(list, sortKey) {
  const sorted = list.slice();
  switch (sortKey) {
    case 'cost-asc':
      sorted.sort((a, b) => a.cost - b.cost);
      break;
    case 'cost-desc':
      sorted.sort((a, b) => b.cost - a.cost);
      break;
    case 'rarity':
      sorted.sort((a, b) => rarityOrder[a.rarity] - rarityOrder[b.rarity]);
      break;
    case 'name':
      sorted.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      break;
    default:
      // 標準（記述順）のまま
      break;
  }
  return sorted;
}

function render(filterType, filterRarity, filterCost, searchText, sortKey) {
  const tbody = document.getElementById('tbody');
  const cardWrap = document.getElementById('card-wrap');
  tbody.innerHTML = '';
  cardWrap.innerHTML = '';

  const s = searchText.toLowerCase();
  let filtered = CARDS.filter(c => {
    const matchType   = filterType   === 'all' || c.type   === filterType;
    const matchRarity = filterRarity === 'all' || c.rarity === filterRarity;
    const matchCost   = filterCost   === 'all' || c.cost   === parseInt(filterCost);
    const matchSearch = !s
      || c.name.includes(s)
      || c.short.includes(s)
      || c.desc.includes(s)
      || typeLabel[c.type].includes(s)
      || rarityLabel[c.rarity].includes(s);
    return matchType && matchRarity && matchCost && matchSearch;
  });

  filtered = sortCards(filtered, sortKey);

  filtered.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-name">${c.name}</td>
      <td style="text-align:center;font-weight:700;font-size:13px;">${c.cost}</td>
      <td><span class="type-tag type-${c.type}">${typeLabel[c.type]}</span></td>
      <td class="r-${c.rarity}" style="white-space:nowrap;">${rarityLabel[c.rarity]}</td>
      <td class="shortdesc">${c.short}</td>
      <td class="fulldesc">${c.desc}</td>
    `;
    tbody.appendChild(tr);

    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `
      <div class="card-item-head">
        <span class="card-item-name">${c.name}</span>
        <span class="card-item-cost">コスト ${c.cost}</span>
      </div>
      <div class="card-item-tags">
        <span class="type-tag type-${c.type}">${typeLabel[c.type]}</span>
        <span class="r-${c.rarity}">${rarityLabel[c.rarity]}</span>
      </div>
      <div class="card-item-short">${c.short}</div>
      <div class="card-item-desc">${c.desc}</div>
    `;
    cardWrap.appendChild(div);
  });

  document.getElementById('count').textContent = `${filtered.length} 件`;

  // タイプ別の内訳を表示
  const breakdown = {};
  filtered.forEach(c => { breakdown[c.type] = (breakdown[c.type] || 0) + 1; });
  const breakdownEl = document.getElementById('count-breakdown');
  breakdownEl.innerHTML = Object.keys(typeLabel)
    .filter(t => breakdown[t])
    .map(t => `<span>${typeLabel[t]} ${breakdown[t]}</span>`)
    .join('');
}

document.addEventListener('DOMContentLoaded', () => {
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    render(currentType, currentRarity, currentCost, document.getElementById('search').value, currentSort);
  });
});
document.querySelectorAll('.rarity-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.rarity-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRarity = btn.dataset.rarity;
    render(currentType, currentRarity, currentCost, document.getElementById('search').value, currentSort);
  });
});
document.querySelectorAll('.cost-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cost-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCost = btn.dataset.cost;
    render(currentType, currentRarity, currentCost, document.getElementById('search').value, currentSort);
  });
});
document.getElementById('search').addEventListener('input', e => {
  render(currentType, currentRarity, currentCost, e.target.value, currentSort);
});
document.getElementById('sort-select').addEventListener('change', e => {
  currentSort = e.target.value;
  render(currentType, currentRarity, currentCost, document.getElementById('search').value, currentSort);
});
document.getElementById('view-toggle').addEventListener('click', () => {
  cardViewOn = !cardViewOn;
  const toggleBtn = document.getElementById('view-toggle');
  const tableWrap = document.getElementById('table-wrap');
  const cardWrap = document.getElementById('card-wrap');
  toggleBtn.classList.toggle('active', cardViewOn);
  toggleBtn.textContent = cardViewOn ? '📊 表形式' : '📱 カード表示';
  tableWrap.classList.toggle('hide', cardViewOn);
  cardWrap.classList.toggle('show', cardViewOn);
});
render('all', 'all', 'all', '', 'default');
});
